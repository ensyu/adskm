[pytest]
# Pytest configuration for ADSKM

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage
addopts = --cov=src/adskm --cov-report=term-missing --cov-report=html

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security tests
    slow: Slow tests

# Minimum coverage
# Enforce 80%+ coverage for core modules
